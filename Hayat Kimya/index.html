<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Ürün İnceleme</title>
  
  <!-- Google'ın WebGL/ThreeJS tabanlı resmi 3D görüntüleyicisi -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, #2c3038 0%, #121418 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      outline: none;
    }

    .ui-panel {
      position: absolute;
      bottom: 24px;
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn {
      background: #ffffff;
      color: #121418;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #e0e0e0;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- 3D Model Görüntüleyici -->
  <model-viewer 
    id="viewer"
    src="urun.glb" 
    alt="3D Ürün Modeli"
    auto-rotate 
    rotation-per-second="20deg"
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1.5"
    shadow-softness="0.8"
    exposure="1.0"
    ar>
  </model-viewer>

  <div class="ui-panel">
    <button class="btn" onclick="toggleRotate()">Dönüşü Durdur / Başlat</button>
    <button class="btn" onclick="resetCamera()">Görünümü Sıfırla</button>
  </div>

  <script>
    const mv = document.getElementById('viewer');

    function toggleRotate() {
      mv.autoRotate = !mv.autoRotate;
    }

    function resetCamera() {
      mv.cameraOrbit = "0deg 75deg 105%";
    }
  </script>

</body>
</html>
